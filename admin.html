<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin & Seller Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .stone-card { background: #fafafa; border: 1px dashed #ccc; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  </style>
</head>
<body class="p-3 p-md-4">

<div class="container" style="max-width: 900px;">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold m-0">Admin & Seller Control Hub</h4>
    <span class="badge bg-dark px-3 py-2 fs-6">Live 24K Benchmark: ₹<span id="admRateDisplay">...</span>/g</span>
  </div>

  <div class="row g-4">
    
    <!-- 1. Master Gold Rate Controller -->
    <div class="col-12">
      <div class="card p-4 shadow-sm border-0">
        <h5 class="fw-bold text-danger mb-2"><i class="bi bi-lightning-charge-fill"></i> Update Master Gold Rate (24K)</h5>
        <p class="text-muted small">Changing this rate automatically updates all 24K Coins, 22K Ginni & Traditional Jewellery, and 18K/14K Diamond Jewellery.</p>
        <div class="input-group mb-3">
          <span class="input-group-text fw-bold">₹</span>
          <input type="number" id="rateInput" class="form-control form-control-lg fw-bold" placeholder="7400">
          <button class="btn btn-danger px-4 fw-bold" id="btnRate" onclick="updateRate()">Update & Recalculate</button>
        </div>
      </div>
    </div>

    <!-- 2. Product Listing Portal -->
    <div class="col-12">
      <div class="card p-4 shadow-sm border-0">
        <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle me-1"></i> Add New Jewellery / Coin Item</h5>
        <form id="prodForm" onsubmit="handleProductSubmit(event)">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold">Product Title</label>
              <input type="text" id="p_title" class="form-control" placeholder="e.g. 24K Gold Coin 10g / Solitaire Ring" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Category</label>
              <select id="p_category" class="form-select" onchange="onCategoryChanged(this.value)">
                <option value="Ring">Ring</option>
                <option value="Necklace">Necklace</option>
                <option value="Earrings">Earrings</option>
                <option value="Bangle">Bangle</option>
                <option value="Bracelet">Bracelet</option>
                <option value="Pendant">Pendant</option>
                <option value="Mangalsutra">Mangalsutra</option>
                <option value="Nose Pin">Nose Pin</option>
                <option value="Coin">Gold Coin (24K)</option>
                <option value="Ginni">Ginni (22K)</option>
                <option value="Other">Other (Custom Category)</option>
              </select>
            </div>

            <!-- Custom Category Field -->
            <div class="col-md-12" id="customCategoryDiv" style="display: none;">
              <label class="form-label fw-semibold text-primary">Enter Custom Category</label>
              <input type="text" id="p_custom_category" class="form-control" placeholder="e.g. Payal, Kada, Brooch...">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Gold Purity (Karat)</label>
              <select id="p_karat" class="form-select">
                <!-- Populated dynamically based on category -->
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Hallmark / Certification</label>
              <input type="text" id="p_cert" class="form-control" value="BIS 916 Hallmarked" required>
            </div>
            <div class="col-md-12">
              <label class="form-label fw-semibold">Image URL</label>
              <input type="url" id="p_img" class="form-control" placeholder="https://..." required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Gross Weight (g)</label>
              <input type="number" step="0.001" id="p_gross" class="form-control" placeholder="e.g. 10.000" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Net Gold Weight (g)</label>
              <input type="number" step="0.001" id="p_net" class="form-control" placeholder="e.g. 10.000" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Making / Wastage Charges (₹)</label>
              <input type="number" id="p_making" class="form-control" placeholder="e.g. 500" required>
            </div>
          </div>

          <!-- Stones Section -->
          <div id="stonesSection" class="mt-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold m-0">💎 Diamonds & Gemstones (Optional)</h6>
              <button type="button" class="btn btn-outline-primary btn-sm" onclick="addStoneRow()">+ Add Stone</button>
            </div>
            <div id="stonesWrap"></div>
          </div>

          <div class="mb-3 mt-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea id="p_desc" class="form-control" rows="2" placeholder="Item purity, minting info, or stone specifications..."></textarea>
          </div>

          <button type="submit" id="subBtn" class="btn btn-dark w-100 py-2 fw-bold">Publish to Google Sheet</button>
        </form>
      </div>
    </div>

  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz5uc_CI0_NhdStVcFhtvDJ7PORoGu7qzlx_JL44S1G4tQmvxpo9tPRicv9a_rNrqT5/exec";

  function onCategoryChanged(category) {
    const karatSelect = document.getElementById('p_karat');
    const certInput = document.getElementById('p_cert');
    const stonesSection = document.getElementById('stonesSection');
    const customCatDiv = document.getElementById('customCategoryDiv');
    const customCatInput = document.getElementById('p_custom_category');

    // Toggle custom category input
    if (category === 'Other') {
      customCatDiv.style.display = 'block';
      customCatInput.required = true;
    } else {
      customCatDiv.style.display = 'none';
      customCatInput.required = false;
      customCatInput.value = '';
    }

    // Dynamic Purity Enforcement
    if (category === 'Coin') {
      karatSelect.innerHTML = '<option value="24K" selected>24K (99.9% Pure Gold Coin)</option>';
      certInput.value = "999 Fine Gold / Assay Certified";
      stonesSection.style.display = "none";
    } else if (category === 'Ginni') {
      karatSelect.innerHTML = '<option value="22K" selected>22K (91.6% Pure Traditional Ginni)</option>';
      certInput.value = "BIS 916 Hallmarked";
      stonesSection.style.display = "none";
    } else {
      karatSelect.innerHTML = `
        <option value="22K" selected>22K (91.6% Hallmark Gold)</option>
        <option value="18K">18K (75.0% Fine Diamond Gold)</option>
        <option value="14K">14K (58.3% Dailywear Gold)</option>
      `;
      certInput.value = "BIS Hallmarked";
      stonesSection.style.display = "block";
    }
  }

  async function initAdmin() {
    onCategoryChanged(document.getElementById('p_category').value);
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      document.getElementById('admRateDisplay').innerText = Number(data.rates.gold24k).toLocaleString('en-IN');
      document.getElementById('rateInput').value = data.rates.gold24k;
    } catch(err) {
      console.error(err);
    }
  }

  function addStoneRow() {
    const wrap = document.getElementById('stonesWrap');
    const div = document.createElement('div');
    div.className = 'stone-card';
    div.innerHTML = `
      <div class="row g-2 align-items-center">
        <div class="col-md-3"><input type="text" class="form-control form-control-sm s-type" placeholder="Stone Type" required></div>
        <div class="col-md-2"><input type="number" step="0.01" class="form-control form-control-sm s-carat" placeholder="Carat"></div>
        <div class="col-md-2"><input type="number" class="form-control form-control-sm s-qty" placeholder="Qty" value="1" required></div>
        <div class="col-md-4"><input type="number" class="form-control form-control-sm s-price" placeholder="Cost (₹)" required></div>
        <div class="col-md-1 text-end"><button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="this.closest('.stone-card').remove()">✕</button></div>
      </div>
    `;
    wrap.appendChild(div);
  }

  async function updateRate() {
    const rate = document.getElementById('rateInput').value;
    if (!rate) return alert('Enter a valid rate');
    
    const btn = document.getElementById('btnRate');
    btn.disabled = true;
    btn.innerText = 'Updating...';

    try {
      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateRate", newRate: rate })
      });
      alert('Gold rate updated and all inventory prices refreshed!');
      initAdmin();
    } catch(err) {
      alert('Rate updated successfully!');
      initAdmin();
    } finally {
      btn.disabled = false;
      btn.innerText = 'Update & Recalculate';
    }
  }

  async function handleProductSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('subBtn');
    btn.disabled = true;
    btn.innerText = 'Publishing...';

    const stones = [];
    document.querySelectorAll('.stone-card').forEach(row => {
      stones.push({
        type: row.querySelector('.s-type').value,
        carat: row.querySelector('.s-carat').value,
        qty: row.querySelector('.s-qty').value,
        price: row.querySelector('.s-price').value
      });
    });

    let selectedCategory = document.getElementById('p_category').value;
    if (selectedCategory === 'Other') {
      selectedCategory = document.getElementById('p_custom_category').value.trim() || 'Other';
    }

    const payload = {
      title: document.getElementById('p_title').value,
      category: selectedCategory,
      karat: document.getElementById('p_karat').value,
      certificate: document.getElementById('p_cert').value,
      image: document.getElementById('p_img').value,
      grossWt: document.getElementById('p_gross').value,
      netGoldWt: document.getElementById('p_net').value,
      makingCharges: document.getElementById('p_making').value,
      description: document.getElementById('p_desc').value,
      stones: stones
    };

    try {
      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "saveProduct", product: payload })
      });
      alert('Product published to Google Sheet!');
      document.getElementById('prodForm').reset();
      document.getElementById('stonesWrap').innerHTML = '';
      onCategoryChanged('Ring');
      initAdmin();
    } catch(err) {
      alert('Product saved successfully!');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Publish to Google Sheet';
    }
  }

  window.onload = initAdmin;
</script>
</body>
</html>
