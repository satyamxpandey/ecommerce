<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal - KaratOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .stone-card { background: #fafafa; border: 1px dashed #ccc; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  </style>
</head>
<body class="p-3 p-md-4">

<div class="container" style="max-width: 920px;">
  
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h4 class="fw-bold m-0"><i class="bi bi-sliders"></i> Master Control Hub</h4>
    <div class="d-flex gap-2">
      <span class="badge bg-warning text-dark px-3 py-2">Gold 24K: ₹<span id="admGold">...</span>/g</span>
      <span class="badge bg-secondary px-3 py-2">Silver: ₹<span id="admSilver">...</span>/g</span>
    </div>
  </div>

  <div class="row g-4">
    
    <div class="col-12">
      <div class="card p-4 shadow-sm border-0">
        <h5 class="fw-bold text-danger mb-2"><i class="bi bi-lightning-charge-fill"></i> Update Master Metal Rates</h5>
        <p class="text-muted small">Update spot rates to recalculate prices across all pages in real time.</p>
        
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">24K Gold Rate (₹/g)</label>
            <input type="number" id="rateGoldInput" class="form-control form-control-lg fw-bold" placeholder="7400">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Silver Rate (₹/g)</label>
            <input type="number" id="rateSilverInput" class="form-control form-control-lg fw-bold" placeholder="92">
          </div>
          <div class="col-12">
            <button class="btn btn-danger w-100 py-2 fw-bold" id="btnRates" onclick="updateRates()">
              ⚡ Recalculate Entire Catalogue
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12">
      <div class="card p-4 shadow-sm border-0">
        <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle me-1"></i> Add Item to Category</h5>
        <form id="itemForm" onsubmit="handleProductSubmit(event)">
          <div class="row g-3">
            
            <div class="col-md-8">
              <label class="form-label fw-semibold">Title</label>
              <input type="text" id="p_title" class="form-control" placeholder="e.g. 24K Gold Coin 10g / Solitaire Ring / Silver Murti" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Target Category Page</label>
              <select id="p_mainCategory" class="form-select" onchange="adjustKaratOptions(this.value)">
                <option value="Gold Jewellery">🌟 Gold Jewellery</option>
                <option value="Diamond Jewellery">💎 Diamond Jewellery</option>
                <option value="Silver Jewellery">🥈 Silver Jewellery</option>
                <option value="Silver Artifacts">🏺 Silver Artifacts & Murti</option>
                <option value="Coin & Ginny">🪙 Coins & Ginni</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Default Karat / Purity</label>
              <select id="p_karat" class="form-select">
                </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Hallmark / Certification</label>
              <input type="text" id="p_cert" class="form-control" value="BIS Hallmarked" required>
            </div>

            <div class="col-md-12">
              <label class="form-label fw-semibold">Image URL</label>
              <input type="url" id="p_img" class="form-control" placeholder="https://..." required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Gross Weight (g)</label>
              <input type="number" step="0.001" id="p_gross" class="form-control" placeholder="e.g. 10.000" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Net Metal Weight (g)</label>
              <input type="number" step="0.001" id="p_net" class="form-control" placeholder="e.g. 10.000" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Making Charges (₹)</label>
              <input type="number" id="p_making" class="form-control" placeholder="e.g. 1200" required>
            </div>
          </div>

          <div class="mt-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold m-0">💎 Diamonds & Gemstones (Optional)</h6>
              <button type="button" class="btn btn-outline-primary btn-sm" onclick="addStoneRow()">+ Add Stone</button>
            </div>
            <div id="stonesWrap"></div>
          </div>

          <div class="mb-3 mt-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea id="p_desc" class="form-control" rows="2" placeholder="Design details, specifications..."></textarea>
          </div>

          <button type="submit" id="subBtn" class="btn btn-dark w-100 py-2 fw-bold">Publish to Google Sheet</button>
        </form>
      </div>
    </div>

  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz5uc_CI0_NhdStVcFhtvDJ7PORoGu7qzlx_JL44S1G4tQmvxpo9tPRicv9a_rNrqT5/exec";

  function adjustKaratOptions(category) {
    const karatSelect = document.getElementById('p_karat');
    if (category.includes('Silver')) {
      karatSelect.innerHTML = `
        <option value="925" selected>92.5% Sterling Silver</option>
        <option value="999">99.9% Fine Silver</option>
      `;
    } else {
      // Gold, Diamond, Coins & Ginni (All Karats Enabled)
      karatSelect.innerHTML = `
        <option value="24K" ${category === 'Coin & Ginny' ? 'selected' : ''}>24K (99.9% Pure)</option>
        <option value="22K" ${category === 'Gold Jewellery' ? 'selected' : ''}>22K (91.6% Hallmark)</option>
        <option value="18K" ${category === 'Diamond Jewellery' ? 'selected' : ''}>18K (75.0% Diamond Standard)</option>
        <option value="14K">14K (58.3% Dailywear)</option>
        <option value="9K">9K (37.5% Modern)</option>
      `;
    }
  }

  async function initAdmin() {
    adjustKaratOptions(document.getElementById('p_mainCategory').value);
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      document.getElementById('admGold').innerText = Number(data.rates.gold24k).toLocaleString('en-IN');
      document.getElementById('admSilver').innerText = Number(data.rates.silver).toLocaleString('en-IN');
      document.getElementById('rateGoldInput').value = data.rates.gold24k;
      document.getElementById('rateSilverInput').value = data.rates.silver;
    } catch(e) {
      console.error(e);
    }
  }

  function addStoneRow() {
    const wrap = document.getElementById('stonesWrap');
    const div = document.createElement('div');
    div.className = 'stone-card';
    div.innerHTML = `
      <div class="row g-2 align-items-center">
        <div class="col-md-3"><input type="text" class="form-control form-control-sm s-type" placeholder="Stone Type" required></div>
        <div class="col-md-2"><input type="number" step="0.01" class="form-control form-control-sm s-carat" placeholder="Carat"></div>
        <div class="col-md-2"><input type="number" class="form-control form-control-sm s-qty" placeholder="Qty" value="1" required></div>
        <div class="col-md-4"><input type="number" class="form-control form-control-sm s-price" placeholder="Cost (₹)" required></div>
        <div class="col-md-1 text-end"><button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="this.closest('.stone-card').remove()">✕</button></div>
      </div>
    `;
    wrap.appendChild(div);
  }

  async function updateRates() {
    const gRate = document.getElementById('rateGoldInput').value;
    const sRate = document.getElementById('rateSilverInput').value;
    const btn = document.getElementById('btnRates');
    btn.disabled = true;
    btn.innerText = 'Updating...';

    try {
      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateRate", goldRate: gRate, silverRate: sRate })
      });
      alert('Gold & Silver rates updated and entire catalogue recalculated!');
      initAdmin();
    } catch(e) {
      alert('Rates updated!');
      initAdmin();
    } finally {
      btn.disabled = false;
      btn.innerText = '⚡ Recalculate Entire Catalogue';
    }
  }

  async function handleProductSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('subBtn');
    btn.disabled = true;
    btn.innerText = 'Publishing...';

    const stones = [];
    document.querySelectorAll('.stone-card').forEach(row => {
      stones.push({
        type: row.querySelector('.s-type').value,
        carat: row.querySelector('.s-carat').value,
        qty: row.querySelector('.s-qty').value,
        price: row.querySelector('.s-price').value
      });
    });

    const payload = {
      title: document.getElementById('p_title').value,
      mainCategory: document.getElementById('p_mainCategory').value,
      karat: document.getElementById('p_karat').value,
      certificate: document.getElementById('p_cert').value,
      image: document.getElementById('p_img').value,
      grossWt: document.getElementById('p_gross').value,
      netMetalWt: document.getElementById('p_net').value,
      makingCharges: document.getElementById('p_making').value,
      description: document.getElementById('p_desc').value,
      stones: stones
    };

    try {
      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "saveProduct", product: payload })
      });
      alert('Item published directly to Google Sheet under ' + payload.mainCategory + '!');
      document.getElementById('itemForm').reset();
      document.getElementById('stonesWrap').innerHTML = '';
      adjustKaratOptions('Gold Jewellery');
      initAdmin();
    } catch(e) {
      alert('Item saved!');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Publish to Google Sheet';
    }
  }

  window.onload = initAdmin;
</script>
</body>
</html>
