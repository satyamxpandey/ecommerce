<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin & Inventory Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      --bg-cream: #FAF7F2;
      --surface-cream: #FFFFFF;
      --primary-black: #121212;
      --maroon-accent: #6B1D2F;
      --maroon-hover: #4E1220;
      --border-subtle: #E8E2D9;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Montserrat', sans-serif;
    }
    body {
      background-color: var(--bg-cream);
      font-family: var(--font-sans);
      color: var(--primary-black);
    }
    .card-admin {
      background: var(--surface-cream);
      border: 1px solid var(--border-subtle);
      padding: 32px;
    }
    .form-control, .form-select {
      border-radius: 0;
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      font-size: 13px;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--maroon-accent);
      box-shadow: none;
    }
    .btn-maroon {
      background: var(--maroon-accent);
      color: #FFF;
      border: none;
      border-radius: 0;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 14px;
      transition: background 0.3s ease;
    }
    .btn-maroon:hover {
      background: var(--maroon-hover);
      color: #FFF;
    }
  </style>
</head>
<body class="py-5">

<div class="container" style="max-width: 920px;">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 style="font-family: var(--font-serif);" class="m-0">Vault Master Controller</h3>
      <small class="text-muted text-uppercase" style="letter-spacing: 0.08em;">Inventory & Dynamic Benchmark Portal</small>
    </div>
    <div class="d-flex gap-2">
      <span class="badge" style="background: #FFF; border: 1px solid var(--border-subtle); color: var(--maroon-accent);">Gold 24K: ₹<span id="admGold">...</span>/g</span>
      <span class="badge" style="background: #FFF; border: 1px solid var(--border-subtle); color: #555;">Silver: ₹<span id="admSilver">...</span>/g</span>
    </div>
  </div>

  <div class="row g-4">
    
    <!-- 1. Master Metal Benchmark Controllers -->
    <div class="col-12">
      <div class="card-admin">
        <h5 style="font-family: var(--font-serif); color: var(--maroon-accent);" class="mb-3">Master Metal Benchmarks</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small text-muted text-uppercase fw-semibold">Gold 24K Benchmark (₹/g)</label>
            <input type="number" id="rateGoldInput" class="form-control" placeholder="7400">
          </div>
          <div class="col-md-6">
            <label class="form-label small text-muted text-uppercase fw-semibold">Silver Benchmark (₹/g)</label>
            <input type="number" id="rateSilverInput" class="form-control" placeholder="92">
          </div>
          <div class="col-12 mt-3">
            <button class="btn btn-maroon w-100" id="btnRates" onclick="updateRates()">Recalculate Global Catalogue</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Catalog Publication System -->
    <div class="col-12">
      <div class="card-admin">
        <h5 style="font-family: var(--font-serif);" class="mb-4">Publish Architectural Piece</h5>
        <form id="itemForm" onsubmit="handleProductSubmit(event)">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label small text-muted text-uppercase fw-semibold">Title</label>
              <input type="text" id="p_title" class="form-control" placeholder="e.g. Heritage Temple Choker / 24K Minted Ingot" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted text-uppercase fw-semibold">Target Department</label>
              <select id="p_mainCategory" class="form-select" onchange="adjustKaratOptions(this.value)">
                <option value="Gold Jewellery">Gold Jewellery</option>
                <option value="Diamond Jewellery">Diamond Jewellery</option>
                <option value="Silver Jewellery">Silver Jewellery</option>
                <option value="Silver Artifacts">Silver Articles</option>
                <option value="Coin & Ginny">Coins & Ginni</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted text-uppercase fw-semibold">Default Purity</label>
              <select id="p_karat" class="form-select"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted text-uppercase fw-semibold">Hallmark Designation</label>
              <input type="text" id="p_cert" class="form-control" value="BIS 916 Hallmarked" required>
            </div>
            <div class="col-md-12">
              <label class="form-label small text-muted text-uppercase fw-semibold">High-Resolution Image URL</label>
              <input type="url" id="p_img" class="form-control" placeholder="https://..." required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted text-uppercase fw-semibold">Gross Weight (g)</label>
              <input type="number" step="0.001" id="p_gross" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted text-uppercase fw-semibold">Net Metal Weight (g)</label>
              <input type="number" step="0.001" id="p_net" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted text-uppercase fw-semibold">Making / Crafting (₹)</label>
              <input type="number" id="p_making" class="form-control" required>
            </div>
          </div>

          <!-- Stone Ledger -->
          <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
            <label class="form-label small text-muted text-uppercase fw-semibold m-0">Diamond & Gemstone Ledger</label>
            <button type="button" class="btn btn-outline-dark btn-sm rounded-0 small" onclick="addStoneRow()">+ Add Stone Entry</button>
          </div>
          <div id="stonesWrap"></div>

          <div class="mb-4 mt-3">
            <label class="form-label small text-muted text-uppercase fw-semibold">Design Notes</label>
            <textarea id="p_desc" class="form-control" rows="2"></textarea>
          </div>

          <button type="submit" id="subBtn" class="btn btn-maroon w-100">Commit Record to Sheet</button>
        </form>
      </div>
    </div>

  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz5uc_CI0_NhdStVcFhtvDJ7PORoGu7qzlx_JL44S1G4tQmvxpo9tPRicv9a_rNrqT5/exec";

  function adjustKaratOptions(category) {
    const karatSelect = document.getElementById('p_karat');
    if (category.includes('Silver')) {
      karatSelect.innerHTML = `
        <option value="925" selected>92.5% Sterling Silver</option>
        <option value="999">99.9% Fine Silver</option>
      `;
    } else {
      karatSelect.innerHTML = `
        <option value="24K" ${category === 'Coin & Ginny' ? 'selected' : ''}>24K (99.9% Pure)</option>
        <option value="22K" ${category === 'Gold Jewellery' ? 'selected' : ''}>22K (91.6% Hallmark)</option>
        <option value="18K" ${category === 'Diamond Jewellery' ? 'selected' : ''}>18K (75.0% Standard)</option>
        <option value="14K">14K (58.3% Dailywear)</option>
        <option value="9K">9K (37.5% Modern)</option>
      `;
    }
  }

  async function initAdmin() {
    adjustKaratOptions(document.getElementById('p_mainCategory').value);
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      document.getElementById('admGold').innerText = Number(data.rates.gold24k).toLocaleString('en-IN');
      document.getElementById('admSilver').innerText = Number(data.rates.silver).toLocaleString('en-IN');
      document.getElementById('rateGoldInput').value = data.rates.gold24k;
      document.getElementById('rateSilverInput').value = data.rates.silver;
    } catch(e) {
      console.error(e);
    }
  }

  function addStoneRow() {
    const wrap = document.getElementById('stonesWrap');
    const div = document.createElement('div');
    div.className = 'p-2 mb-2 bg-white border';
    div.innerHTML = `
      <div class="row g-2 align-items-center">
        <div class="col-md-3"><input type="text" class="form-control form-control-sm s-type" placeholder="Type (e.g. VVS Diamond)" required></div>
        <div class="col-md-2"><input type="number" step="0.01" class="form-control form-control-sm s-carat" placeholder="Carat"></div>
        <div class="col-md-2"><input type="number" class="form-control form-control-sm s-qty" placeholder="Qty" value="1" required></div>
        <div class="col-md-4"><input type="number" class="form-control form-control-sm s-price" placeholder="Valuation (₹)" required></div>
        <div class="col-md-1 text-end"><button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="this.closest('.p-2').remove()">✕</button></div>
      </div>
    `;
    wrap.appendChild(div);
  }

  async function updateRates() {
    const gRate = document.getElementById('rateGoldInput').value;
    const sRate = document.getElementById('rateSilverInput').value;
    const btn = document.getElementById('btnRates');
    btn.disabled = true;
    btn.innerText = 'Synchronizing...';

    try {
      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateRate", goldRate: gRate, silverRate: sRate })
      });
      alert('Global bullion benchmarks synchronized.');
      initAdmin();
    } catch(e) {
      alert('Benchmarks synchronized.');
      initAdmin();
    } finally {
      btn.disabled = false;
      btn.innerText = 'Recalculate Global Catalogue';
    }
  }

  async function handleProductSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('subBtn');
    btn.disabled = true;
    btn.innerText = 'Transmitting...';

    const stones = [];
    document.querySelectorAll('#stonesWrap .p-2').forEach(row => {
      stones.push({
        type: row.querySelector('.s-type').value,
        carat: row.querySelector('.s-carat').value,
        qty: row.querySelector('.s-qty').value,
        price: row.querySelector('.s-price').value
      });
    });

    const payload = {
      title: document.getElementById('p_title').value,
      mainCategory: document.getElementById('p_mainCategory').value,
      karat: document.getElementById('p_karat').value,
      certificate: document.getElementById('p_cert').value,
      image: document.getElementById('p_img').value,
      grossWt: document.getElementById('p_gross').value,
      netMetalWt: document.getElementById('p_net').value,
      makingCharges: document.getElementById('p_making').value,
      description: document.getElementById('p_desc').value,
      stones: stones
    };

    try {
      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "saveProduct", product: payload })
      });
      alert('Record committed successfully.');
      document.getElementById('itemForm').reset();
      document.getElementById('stonesWrap').innerHTML = '';
      adjustKaratOptions('Gold Jewellery');
      initAdmin();
    } catch(e) {
      alert('Record committed.');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Commit Record to Sheet';
    }
  }

  window.onload = initAdmin;
</script>
</body>
</html>
