<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Jewellery | Suman Jewellers</title>

  <!-- Google Fonts & Bootstrap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- AOS (Scroll Magic Animation Engine) -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF7F2;
      --surface-cream: #FFFFFF;
      --primary-black: #121212;
      --maroon-accent: #6B1D2F;
      --maroon-hover: #4E1220;
      --maroon-light: #F4E8EB;
      --border-maroon: rgba(107, 29, 47, 0.2);
      --border-subtle: #E8E2D9;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      font-family: var(--font-sans);
      color: var(--primary-black);
      letter-spacing: 0.02em;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, .brand-font {
      font-family: var(--font-serif);
      letter-spacing: 0.04em;
    }

    /* Header & Ticker */
    .header-luxury {
      background: var(--surface-cream);
      border-bottom: 1px solid var(--border-subtle);
    }
    .rate-pill {
      border: 1px solid var(--border-maroon);
      background: var(--surface-cream);
      padding: 6px 16px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--maroon-accent);
    }

    /* Category Navigation */
    .nav-luxury-container {
      border-bottom: 1px solid var(--border-subtle);
    }
    .nav-luxury .nav-link {
      color: #666;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      padding: 16px 24px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .nav-luxury .nav-link:hover {
      color: var(--maroon-accent);
    }
    .nav-luxury .nav-link.active {
      color: var(--maroon-accent);
      border-bottom: 2px solid var(--maroon-accent);
      font-weight: 600;
    }

    /* Multi-Filter Bar */
    .filter-panel {
      background: var(--surface-cream);
      border: 1px solid var(--border-subtle);
      padding: 20px 24px;
      margin-bottom: 36px;
    }
    .filter-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7A7267;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }
    .select-luxury, .search-luxury {
      background: var(--bg-cream);
      border: 1px solid var(--border-subtle);
      border-radius: 0;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--primary-black);
      font-weight: 500;
    }
    .select-luxury:focus, .search-luxury:focus {
      border-color: var(--maroon-accent);
      box-shadow: none;
      background: #FFF;
    }
    .btn-reset {
      background: transparent;
      border: 1px solid var(--border-maroon);
      color: var(--maroon-accent);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 0;
      transition: all 0.2s ease;
      height: 38px;
    }
    .btn-reset:hover {
      background: var(--maroon-accent);
      color: #FFF;
    }

    /* Product Card */
    .card-product {
      background: var(--surface-cream);
      border: 1px solid var(--border-subtle);
      transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease, border-color 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }
    .card-product:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 36px rgba(107, 29, 47, 0.08);
      border-color: var(--maroon-accent);
      color: inherit;
    }
    .card-img-wrapper {
      position: relative;
      overflow: hidden;
      background-color: #F0EDE8;
      padding-top: 110%;
    }
    .card-img-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }
    .card-product:hover .card-img-wrapper img {
      transform: scale(1.05);
    }
    .cert-badge {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--maroon-accent);
      background: var(--maroon-light);
      padding: 3px 8px;
      font-weight: 600;
    }
    .karat-badge {
      font-size: 11px;
      letter-spacing: 0.08em;
      border: 1px solid var(--border-subtle);
      padding: 2px 8px;
      color: #777;
    }
    .price-tag {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary-black);
    }
  </style>
</head>
<body>

  <!-- Top Benchmark Rates Header -->
  <header class="header-luxury py-3 px-4">
    <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-3" style="max-width: 1360px;">
      <div>
        <h3 class="m-0 text-uppercase fw-bold brand-font">All Jewellery</h3>
        <p class="m-0 text-muted small" style="letter-spacing: 0.08em;">Explore Suman Jewellers Collection</p>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <div class="rate-pill">
          Gold 24K Benchmark: <strong>₹<span id="rateGold">...</span> /g</strong>
        </div>
        <div class="rate-pill" style="border-color: #D3C9BE; color: #555;">
          Silver Benchmark: <strong>₹<span id="rateSilver">...</span> /g</strong>
        </div>
      </div>
    </div>
  </header>

  <!-- Category Filter Bar -->
  <div class="nav-luxury-container">
    <div class="container-fluid px-4" style="max-width: 1360px;">
      <ul class="nav nav-luxury flex-nowrap overflow-auto" id="categoryTabs">
        <li class="nav-item">
          <button class="nav-link active" onclick="switchCategoryPage('ALL')">All Pieces</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="switchCategoryPage('Gold Jewellery')">Gold Jewellery</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="switchCategoryPage('Diamond Jewellery')">Diamond Jewellery</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="switchCategoryPage('Silver Jewellery')">Silver Jewellery</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="switchCategoryPage('Silver Artifacts')">Silver Articles</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="switchCategoryPage('Coin & Ginny')">Coins & Ginni</button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Main Content Stage -->
  <main class="container-fluid py-5 px-4" style="max-width: 1360px;">
    
    <!-- Comprehensive Multi-Attribute Filter Suite -->
    <div class="filter-panel" data-aos="fade-up">
      <div class="row g-3 align-items-end">
        
        <!-- 1. Search Field -->
        <div class="col-lg-3 col-md-6">
          <label class="filter-label">Search Collection</label>
          <input type="text" id="searchBox" class="form-control search-luxury" placeholder="Design, gemstone, or keyword..." onkeyup="applyAllFilters()">
        </div>

        <!-- 2. Purity / Karat Filter -->
        <div class="col-lg-2 col-md-3 col-6">
          <label class="filter-label">Purity / Karat</label>
          <select id="karatFilter" class="form-select select-luxury" onchange="applyAllFilters()">
            <option value="ALL">All Purities</option>
            <option value="24K">24K (99.9% Gold)</option>
            <option value="22K">22K (91.6% Gold)</option>
            <option value="18K">18K (75.0% Gold)</option>
            <option value="14K">14K (58.3% Gold)</option>
            <option value="9K">9K (37.5% Gold)</option>
            <option value="925">925 Sterling Silver</option>
            <option value="999">999 Fine Silver</option>
          </select>
        </div>

        <!-- 3. Price Bracket -->
        <div class="col-lg-2 col-md-3 col-6">
          <label class="filter-label">Price Bracket</label>
          <select id="priceFilter" class="form-select select-luxury" onchange="applyAllFilters()">
            <option value="ALL">All Price Ranges</option>
            <option value="0-25000">Under ₹25,000</option>
            <option value="25000-50000">₹25,000 – ₹50,000</option>
            <option value="50000-100000">₹50,000 – ₹1,00,000</option>
            <option value="100000-250000">₹1,00,000 – ₹2,50,000</option>
            <option value="250000-99999999">₹2,50,000 & Above</option>
          </select>
        </div>

        <!-- 4. Weight Classification -->
        <div class="col-lg-2 col-md-4 col-6">
          <label class="filter-label">Metal Weight</label>
          <select id="weightFilter" class="form-select select-luxury" onchange="applyAllFilters()">
            <option value="ALL">All Weights</option>
            <option value="0-5">Lightweight (0 – 5g)</option>
            <option value="5-15">Classic (5g – 15g)</option>
            <option value="15-30">Statement (15g – 30g)</option>
            <option value="30-9999">Investment (30g+)</option>
          </select>
        </div>

        <!-- 5. Sorting -->
        <div class="col-lg-2 col-md-4 col-6">
          <label class="filter-label">Sort Order</label>
          <select id="sortFilter" class="form-select select-luxury" onchange="applyAllFilters()">
            <option value="featured">Curated (Default)</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="weight-asc">Weight: Low to High</option>
            <option value="weight-desc">Weight: High to Low</option>
          </select>
        </div>

        <!-- 6. Reset Button -->
        <div class="col-lg-1 col-md-4 col-12 text-end">
          <button class="btn btn-reset w-100" onclick="resetAllFilters()" title="Reset Filters">Reset</button>
        </div>

      </div>
    </div>

    <!-- Active Count Counter -->
    <div class="d-flex justify-content-between align-items-center mb-4 text-muted small" style="letter-spacing: 0.06em;">
      <div><span id="resultsCount">0</span> Masterpieces Available</div>
    </div>

    <!-- Product Grid -->
    <div class="row g-4" id="catalogueGrid">
      <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border spinner-border-sm text-secondary mb-2" role="status"></div>
        <div class="small text-uppercase">Accessing Vault...</div>
      </div>
    </div>

  </main>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true, offset: 50 });

    const API_URL = "https://script.google.com/macros/s/AKfycbz5uc_CI0_NhdStVcFhtvDJ7PORoGu7qzlx_JL44S1G4tQmvxpo9tPRicv9a_rNrqT5/exec";
    let STORE_DATA = null;
    let ACTIVE_CATEGORY = 'ALL';

    async function loadStore() {
      try {
        const res = await fetch(API_URL);
        STORE_DATA = await res.json();
        document.getElementById('rateGold').innerText = Number(STORE_DATA.rates.gold24k).toLocaleString('en-IN');
        document.getElementById('rateSilver').innerText = Number(STORE_DATA.rates.silver).toLocaleString('en-IN');
        applyAllFilters();
      } catch (e) {
        document.getElementById('catalogueGrid').innerHTML = `<div class="col-12 text-center py-5 text-muted">Unable to retrieve live inventory.</div>`;
      }
    }

    function switchCategoryPage(cat) {
      ACTIVE_CATEGORY = cat;
      document.querySelectorAll('#categoryTabs .nav-link').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
      applyAllFilters();
    }

    function resetAllFilters() {
      document.getElementById('searchBox').value = '';
      document.getElementById('karatFilter').value = 'ALL';
      document.getElementById('priceFilter').value = 'ALL';
      document.getElementById('weightFilter').value = 'ALL';
      document.getElementById('sortFilter').value = 'featured';
      applyAllFilters();
    }

    function applyAllFilters() {
      if (!STORE_DATA || !STORE_DATA.products) return;

      const q = document.getElementById('searchBox').value.toLowerCase().trim();
      const karat = document.getElementById('karatFilter').value;
      const priceRange = document.getElementById('priceFilter').value;
      const weightRange = document.getElementById('weightFilter').value;
      const sortOrder = document.getElementById('sortFilter').value;

      let filtered = STORE_DATA.products.filter(p => {
        // 1. Category Matching
        const matchCat = ACTIVE_CATEGORY === 'ALL' || p.mainCategory === ACTIVE_CATEGORY;

        // 2. Keyword Search
        const matchQuery = !q || p.title.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q)) || (p.certificate && p.certificate.toLowerCase().includes(q));

        // 3. Karat Filter
        const matchKarat = karat === 'ALL' || String(p.karat).toUpperCase().includes(karat);

        // 4. Price Bracket
        let matchPrice = true;
        if (priceRange !== 'ALL') {
          const [minP, maxP] = priceRange.split('-').map(Number);
          matchPrice = p.finalPrice >= minP && p.finalPrice <= maxP;
        }

        // 5. Weight Bracket
        let matchWeight = true;
        if (weightRange !== 'ALL') {
          const [minW, maxW] = weightRange.split('-').map(Number);
          matchWeight = p.netMetalWt >= minW && p.netMetalWt <= maxW;
        }

        return matchCat && matchQuery && matchKarat && matchPrice && matchWeight;
      });

      // Sort Pipeline
      if (sortOrder === 'price-asc') {
        filtered.sort((a, b) => a.finalPrice - b.finalPrice);
      } else if (sortOrder === 'price-desc') {
        filtered.sort((a, b) => b.finalPrice - a.finalPrice);
      } else if (sortOrder === 'weight-asc') {
        filtered.sort((a, b) => a.netMetalWt - b.netMetalWt);
      } else if (sortOrder === 'weight-desc') {
        filtered.sort((a, b) => b.netMetalWt - a.netMetalWt);
      }

      document.getElementById('resultsCount').innerText = filtered.length;
      renderProducts(filtered);
    }

    function renderProducts(list) {
      const grid = document.getElementById('catalogueGrid');
      grid.innerHTML = '';

      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center py-5 text-muted brand-font fs-5">No designs match the selected criteria.</div>`;
        return;
      }

      list.forEach((p, idx) => {
        const col = document.createElement('div');
        col.className = 'col-xl-3 col-lg-4 col-sm-6';
        col.setAttribute('data-aos', 'fade-up');
        col.setAttribute('data-aos-delay', (idx % 4) * 80);

        col.innerHTML = `
          <a href="product.html?id=${p.id}" class="card-product">
            <div class="card-img-wrapper">
              <img src="${p.image}" alt="${p.title}" onerror="this.src='https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=600'"/>
            </div>
            <div class="p-4 d-flex flex-column flex-grow-1">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="cert-badge">${p.certificate || 'BIS Hallmarked'}</span>
                <span class="text-muted small">${p.netMetalWt}g Net</span>
              </div>
              <h6 class="fw-semibold text-dark mb-3 brand-font" style="font-size: 1.05rem;">${p.title}</h6>
              <div class="mt-auto d-flex justify-content-between align-items-baseline pt-2 border-top">
                <span class="karat-badge">${p.karat}</span>
                <span class="price-tag">₹${Number(p.finalPrice).toLocaleString('en-IN')}</span>
              </div>
            </div>
          </a>
        `;
        grid.appendChild(col);
      });
    }

    window.onload = loadStore;
  </script>
</body>
</html>
