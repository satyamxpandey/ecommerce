<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KaratOS Luxury Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --gold-dark: #8c6b12;
      --gold-light: #fff9e6;
    }
    body { background-color: #fcfcfc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-product { border: 1px solid #eee; border-radius: 14px; background: #fff; transition: all 0.2s ease; overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%; }
    .card-product:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); color: inherit; }
    .product-img { width: 100%; height: 240px; object-fit: cover; background-color: #f4f4f4; }
    .badge-ticker { background: var(--gold-light); color: var(--gold-dark); border: 1px solid #fae2a6; font-weight: 700; font-size: 13px; }
    .nav-cat { border-bottom: 2px solid #e9ecef; }
    .nav-cat .nav-link { color: #555; font-weight: 600; padding: 12px 18px; border: none; border-bottom: 3px solid transparent; border-radius: 0; }
    .nav-cat .nav-link.active { color: #000; border-bottom: 3px solid #000; background: transparent; font-weight: 700; }
  </style>
</head>
<body class="p-2 p-md-4">

<div class="container-fluid" style="max-width: 1280px;">
  
  <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded-4 shadow-sm mb-3 border flex-wrap gap-2">
    <div>
      <h4 class="m-0 fw-bold"><i class="bi bi-gem"></i> Jewellery & Bullion Hub</h4>
      <small class="text-muted">Dynamic Real-Time Rate Recalculation</small>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <div class="badge-ticker px-3 py-2 rounded-pill">
        🟡 Gold 24K: <strong>₹<span id="rateGold">...</span>/g</strong>
      </div>
      <div class="badge-ticker px-3 py-2 rounded-pill" style="background:#f1f3f5; color:#495057; border-color:#ced4da;">
        ⚪ Silver: <strong>₹<span id="rateSilver">...</span>/g</strong>
      </div>
    </div>
  </div>

  <ul class="nav nav-cat mb-4 flex-nowrap overflow-auto" id="categoryTabs">
    <li class="nav-item">
      <button class="nav-link active" onclick="switchCategoryPage('ALL')">✨ All Items</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" onclick="switchCategoryPage('Gold Jewellery')">🌟 Gold Jewellery</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" onclick="switchCategoryPage('Diamond Jewellery')">💎 Diamond Jewellery</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" onclick="switchCategoryPage('Silver Jewellery')">🥈 Silver Jewellery</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" onclick="switchCategoryPage('Silver Artifacts')">🏺 Silver Artifacts & Murti</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" onclick="switchCategoryPage('Coin & Ginny')">🪙 Coins & Ginni</button>
    </li>
  </ul>

  <div class="row mb-4">
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
        <input type="text" id="searchBox" class="form-control" placeholder="Search by design name, weight or karat..." onkeyup="filterCatalogue()">
      </div>
    </div>
  </div>

  <div class="row g-4" id="catalogueGrid">
    <div class="col-12 text-center py-5 text-muted">
      <div class="spinner-border spinner-border-sm mb-2" role="status"></div>
      <div>Loading catalogue...</div>
    </div>
  </div>

</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz5uc_CI0_NhdStVcFhtvDJ7PORoGu7qzlx_JL44S1G4tQmvxpo9tPRicv9a_rNrqT5/exec";
  let STORE_DATA = null;
  let ACTIVE_CATEGORY = 'ALL';

  async function loadStore() {
    try {
      const res = await fetch(API_URL);
      STORE_DATA = await res.json();
      document.getElementById('rateGold').innerText = Number(STORE_DATA.rates.gold24k).toLocaleString('en-IN');
      document.getElementById('rateSilver').innerText = Number(STORE_DATA.rates.silver).toLocaleString('en-IN');
      renderProducts();
    } catch (e) {
      document.getElementById('catalogueGrid').innerHTML = `<div class="col-12 text-center text-danger py-5">Error connecting to server.</div>`;
    }
  }

  function switchCategoryPage(cat) {
    ACTIVE_CATEGORY = cat;
    document.querySelectorAll('#categoryTabs .nav-link').forEach(tab => tab.classList.remove('active'));
    event.target.classList.add('active');
    filterCatalogue();
  }

  function renderProducts(items) {
    const list = items || (STORE_DATA ? STORE_DATA.products : []);
    const grid = document.getElementById('catalogueGrid');
    grid.innerHTML = '';

    if (!list || list.length === 0) {
      grid.innerHTML = `<div class="col-12 text-center py-5 text-muted">No products available in this category.</div>`;
      return;
    }

    list.forEach(p => {
      const col = document.createElement('div');
      col.className = 'col-lg-3 col-md-4 col-sm-6';
      col.innerHTML = `
        <a href="product.html?id=${p.id}" class="card-product">
          <img src="${p.image}" class="product-img" alt="${p.title}" onerror="this.src='https://via.placeholder.com/400x300?text=Jewellery'">
          <div class="p-3 d-flex flex-column flex-grow-1">
            <div class="d-flex justify-content-between text-muted small mb-1">
              <span>${p.mainCategory}</span>
              <span>${p.netMetalWt}g Net</span>
            </div>
            <h6 class="fw-bold text-dark mb-2">${p.title}</h6>
            <div class="mt-auto d-flex justify-content-between align-items-baseline">
              <span class="badge bg-light text-dark border">${p.karat}</span>
              <span class="fs-5 fw-bold text-dark">₹${Number(p.finalPrice).toLocaleString('en-IN')}</span>
            </div>
          </div>
        </a>
      `;
      grid.appendChild(col);
    });
  }

  function filterCatalogue() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const filtered = STORE_DATA.products.filter(p => {
      const matchesCat = ACTIVE_CATEGORY === 'ALL' || p.mainCategory === ACTIVE_CATEGORY;
      const matchesQuery = p.title.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q));
      return matchesCat && matchesQuery;
    });
    renderProducts(filtered);
  }

  window.onload = loadStore;
</script>
</body>
</html>
