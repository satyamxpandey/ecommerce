<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jewellery Collection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-product { border: 1px solid #eee; border-radius: 12px; background: #fff; transition: all 0.2s ease; overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%; }
    .card-product:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.06); color: inherit; }
    .product-img { width: 100%; height: 240px; object-fit: cover; background-color: #f5f5f5; }
    .badge-rate { background: #fff8e6; color: #976b0d; border: 1px solid #fae2a6; font-weight: 600; font-size: 13px; }
  </style>
</head>
<body class="p-3 p-md-4">

<div class="container-fluid" style="max-width: 1240px;">
  
  <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded-3 shadow-sm mb-4 border flex-wrap gap-2">
    <div>
      <h4 class="m-0 fw-bold">Jewellery Collection</h4>
      <small class="text-muted">Live Gold Rate Updated</small>
    </div>
    <div class="badge-rate px-3 py-2 rounded-pill">
      <i class="bi bi-graph-up-arrow me-1"></i> Today's 24K Rate: <strong>₹<span id="rateLabel">...</span>/g</strong>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <input type="text" id="searchBox" class="form-control" placeholder="Search by name or keyword..." onkeyup="filterItems()">
    </div>
    <div class="col-md-3">
      <select id="catBox" class="form-select" onchange="filterItems()">
        <option value="">All Categories</option>
        <option>Ring</option>
        <option>Necklace</option>
        <option>Earrings</option>
        <option>Bangle</option>
        <option>Pendant</option>
      </select>
    </div>
  </div>

  <div class="row g-4" id="grid">
    <div class="col-12 text-center py-5 text-muted">
      <div class="spinner-border spinner-border-sm mb-2" role="status"></div>
      <div>Loading collection...</div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz5uc_CI0_NhdStVcFhtvDJ7PORoGu7qzlx_JL44S1G4tQmvxpo9tPRicv9a_rNrqT5/exec";
  let STORE_DATA = null;

  async function loadData() {
    try {
      const res = await fetch(API_URL);
      STORE_DATA = await res.json();
      document.getElementById('rateLabel').innerText = Number(STORE_DATA.rates.gold24k).toLocaleString('en-IN');
      renderList(STORE_DATA.products);
    } catch(err) {
      document.getElementById('grid').innerHTML = `<div class="col-12 text-center text-danger py-5">Error loading collection.</div>`;
    }
  }

  function renderList(products) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    if (!products || products.length === 0) {
      grid.innerHTML = '<div class="col-12 text-center py-5 text-muted">No products found. Add items from the Admin Panel.</div>';
      return;
    }

    products.forEach(p => {
      const col = document.createElement('div');
      col.className = 'col-lg-3 col-md-4 col-sm-6';
      col.innerHTML = `
        <a href="product.html?id=${p.id}" class="card-product">
          <img src="${p.image}" class="product-img" alt="${p.title}" onerror="this.src='https://via.placeholder.com/400x300?text=Jewellery'">
          <div class="p-3 d-flex flex-column flex-grow-1">
            <div class="d-flex justify-content-between text-muted small mb-1">
              <span>${p.category}</span>
              <span>${p.netGoldWt}g Net</span>
            </div>
            <h6 class="fw-bold text-dark mb-2">${p.title}</h6>
            <div class="mt-auto d-flex justify-content-between align-items-baseline">
              <span class="badge bg-light text-dark border">${p.karat}</span>
              <span class="fs-5 fw-bold text-dark">₹${Number(p.finalPrice).toLocaleString('en-IN')}</span>
            </div>
          </div>
        </a>
      `;
      grid.appendChild(col);
    });
  }

  function filterItems() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const cat = document.getElementById('catBox').value;
    const filtered = STORE_DATA.products.filter(p => {
      const matchQ = p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q);
      const matchCat = cat === '' || p.category === cat;
      return matchQ && matchCat;
    });
    renderList(filtered);
  }

  window.onload = loadData;
</script>
</body>
</html>
