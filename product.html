<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .product-stage-img { width: 100%; max-height: 480px; object-fit: cover; border-radius: 16px; border: 1px solid #eee; }
    .price-box { background: #fff; border: 1px solid #eee; border-radius: 16px; padding: 24px; }
    .btn-wa { background-color: #25D366; color: #fff; font-weight: 600; padding: 14px; border-radius: 12px; }
    .btn-wa:hover { background-color: #1eb954; color: #fff; }
  </style>
</head>
<body class="p-3 p-md-4">

<div class="container" style="max-width: 1000px;" id="mainContainer">
  <div class="text-center py-5 text-muted">
    <div class="spinner-border spinner-border-sm mb-2" role="status"></div>
    <div>Loading product details...</div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz5uc_CI0_NhdStVcFhtvDJ7PORoGu7qzlx_JL44S1G4tQmvxpo9tPRicv9a_rNrqT5/exec";
  const WHATSAPP_PHONE = "919876543210";

  const urlParams = new URLSearchParams(window.location.search);
  const PRODUCT_ID = urlParams.get('id');

  let STORE_DATA = null;
  let ITEM = null;

  async function loadProduct() {
    try {
      const res = await fetch(API_URL);
      STORE_DATA = await res.json();
      
      ITEM = PRODUCT_ID ? STORE_DATA.products.find(p => p.id === PRODUCT_ID) : STORE_DATA.products[0];
      
      if (!ITEM) {
        document.getElementById('mainContainer').innerHTML = `
          <div class="text-center py-5">
            <h4>Product Not Found</h4>
            <a href="index.html" class="btn btn-outline-dark mt-3">Back to Collection</a>
          </div>
        `;
        return;
      }
      renderProductPage(ITEM.karat);
    } catch(err) {
      document.getElementById('mainContainer').innerHTML = `<div class="text-center text-danger py-5">Error loading product data.</div>`;
    }
  }

  function calculatePrice(karat) {
    const factor = STORE_DATA.karatFactors[karat] || 0.9166;
    const goldCost = ITEM.netGoldWt * (STORE_DATA.rates.gold24k * factor);
    const subtotal = goldCost + ITEM.makingCharges + ITEM.stoneCost;
    const gst = subtotal * (STORE_DATA.rates.gst / 100);
    return {
      goldCost: Math.round(goldCost),
      makingCharges: ITEM.makingCharges,
      stoneCost: ITEM.stoneCost,
      subtotal: Math.round(subtotal),
      gst: Math.round(gst),
      finalPrice: Math.round(subtotal + gst)
    };
  }

  function renderProductPage(selectedKarat) {
    const calc = calculatePrice(selectedKarat);
    const waMsg = encodeURIComponent(`Hello, I want to order "${ITEM.title}" (${selectedKarat} Gold) at the live price of ₹${calc.finalPrice.toLocaleString('en-IN')}.`);
    const waLink = `https://wa.me/${WHATSAPP_PHONE}?text=${waMsg}`;

    let stoneRows = '';
    if (ITEM.stones && ITEM.stones.length > 0) {
      stoneRows = ITEM.stones.map(s => `
        <li class="list-group-item d-flex justify-content-between px-0">
          <span>💎 ${s.type} (${s.carat ? s.carat + ' ct' : s.qty + ' pcs'})</span>
          <strong>₹${Number(s.price).toLocaleString('en-IN')}</strong>
        </li>
      `).join('');
    }

    // Dynamic Purity Selector: Only allow variants for regular jewellery
    let puritySectionHtml = '';
    if (ITEM.category === 'Coin') {
      puritySectionHtml = `<div class="alert alert-warning py-2 px-3 fw-bold small">Purity: 24K (99.9% Fine Gold)</div>`;
    } else if (ITEM.category === 'Ginni') {
      puritySectionHtml = `<div class="alert alert-warning py-2 px-3 fw-bold small">Purity: 22K (91.6% Pure Ginni)</div>`;
    } else {
      puritySectionHtml = `
        <label class="form-label fw-bold small text-muted">SELECT GOLD PURITY</label>
        <div class="btn-group w-100 mb-4" role="group">
          ${['14K', '18K', '22K'].map(k => `
            <input type="radio" class="btn-check" name="kOptions" id="k_${k}" ${k === selectedKarat ? 'checked' : ''} onchange="renderProductPage('${k}')">
            <label class="btn btn-outline-dark" for="k_${k}">${k}</label>
          `).join('')}
        </div>
      `;
    }

    document.getElementById('mainContainer').innerHTML = `
      <div class="mb-3">
        <a href="index.html" class="text-muted text-decoration-none small">
          <i class="bi bi-arrow-left"></i> Back to Collection
        </a>
      </div>

      <div class="row g-4">
        <div class="col-md-6">
          <img src="${ITEM.image}" class="product-stage-img shadow-sm" alt="${ITEM.title}" onerror="this.src='https://via.placeholder.com/600x600?text=Jewellery'">
        </div>
        
        <div class="col-md-6">
          <div class="price-box shadow-sm">
            <span class="badge bg-light text-primary border mb-2">${ITEM.certificate}</span>
            <h3 class="fw-bold mb-2">${ITEM.title}</h3>
            <p class="text-muted small mb-3">${ITEM.description || ''}</p>

            ${puritySectionHtml}

            <div class="card bg-light border-0 p-3 mb-4">
              <h6 class="fw-bold mb-3">Price Breakdown</h6>
              <ul class="list-group list-group-flush bg-transparent">
                <li class="list-group-item bg-transparent d-flex justify-content-between px-0">
                  <span>Gold Cost (${ITEM.netGoldWt}g @ ${selectedKarat})</span>
                  <strong>₹${calc.goldCost.toLocaleString('en-IN')}</strong>
                </li>
                ${stoneRows}
                <li class="list-group-item bg-transparent d-flex justify-content-between px-0">
                  <span>Making Charges</span>
                  <strong>₹${calc.makingCharges.toLocaleString('en-IN')}</strong>
                </li>
                <li class="list-group-item bg-transparent d-flex justify-content-between px-0">
                  <span>GST (${STORE_DATA.rates.gst}%)</span>
                  <strong>₹${calc.gst.toLocaleString('en-IN')}</strong>
                </li>
                <li class="list-group-item bg-transparent d-flex justify-content-between px-0 fs-5 fw-bold text-dark pt-2 border-top">
                  <span>Total Amount</span>
                  <span>₹${calc.finalPrice.toLocaleString('en-IN')}</span>
                </li>
              </ul>
            </div>

            <a href="${waLink}" target="_blank" class="btn btn-wa w-100 d-block text-center text-decoration-none">
              <i class="bi bi-whatsapp me-2"></i> Order on WhatsApp
            </a>
          </div>
        </div>
      </div>
    `;
  }

  window.onload = loadProduct;
</script>
</body>
</html>
