<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | Suman Jewellers</title>

  <!-- Google Fonts & Bootstrap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF7F2;
      --surface-cream: #FFFFFF;
      --primary-black: #121212;
      --maroon-accent: #6B1D2F;
      --maroon-hover: #4E1220;
      --maroon-light: #F4E8EB;
      --border-maroon: rgba(107, 29, 47, 0.25);
      --border-subtle: #E8E2D9;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      font-family: var(--font-sans);
      color: var(--primary-black);
      letter-spacing: 0.02em;
    }

    h1, h2, h3, h4, h5, .brand-font {
      font-family: var(--font-serif);
      letter-spacing: 0.03em;
    }

    .product-img-stage {
      width: 100%;
      height: 540px;
      object-fit: cover;
      background: #F0EDE8;
      border: 1px solid var(--border-subtle);
    }

    .detail-card {
      background: var(--surface-cream);
      border: 1px solid var(--border-subtle);
      padding: 36px;
    }

    .btn-karat {
      border: 1px solid var(--border-subtle);
      background: var(--surface-cream);
      color: #666;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 8px 16px;
      transition: all 0.2s ease;
    }
    .btn-check:checked + .btn-karat {
      border-color: var(--maroon-accent);
      background: var(--maroon-accent);
      color: #FFF;
    }

    .breakdown-box {
      background: #FAF8F5;
      border: 1px solid var(--border-subtle);
      padding: 24px;
    }

    .btn-order-wa {
      background: var(--maroon-accent);
      color: #FFF;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 16px;
      border-radius: 0;
      border: none;
      transition: background 0.3s ease;
    }
    .btn-order-wa:hover {
      background: var(--maroon-hover);
      color: #FFF;
    }
  </style>
</head>
<body class="py-5">

<div class="container" style="max-width: 1120px;" id="mainStage">
  <div class="text-center py-5 text-muted">
    <div class="spinner-border spinner-border-sm mb-2" role="status"></div>
    <div class="small text-uppercase">Retrieving Architectural Data...</div>
  </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({ duration: 800, once: true });

  const API_URL = "https://script.google.com/macros/s/AKfycbz5uc_CI0_NhdStVcFhtvDJ7PORoGu7qzlx_JL44S1G4tQmvxpo9tPRicv9a_rNrqT5/exec";
  const WHATSAPP_PHONE = "919876543210";

  const urlParams = new URLSearchParams(window.location.search);
  const PRODUCT_ID = urlParams.get('id');

  let STORE_DATA = null;
  let ITEM = null;

  async function loadProduct() {
    try {
      const res = await fetch(API_URL);
      STORE_DATA = await res.json();
      
      ITEM = PRODUCT_ID ? STORE_DATA.products.find(p => p.id === PRODUCT_ID) : STORE_DATA.products[0];
      
      if (!ITEM) {
        document.getElementById('mainStage').innerHTML = `
          <div class="text-center py-5">
            <h4 class="brand-font">Designation Not Found</h4>
            <a href="index.html" class="btn btn-outline-dark mt-3 rounded-0 text-uppercase small">Return to Vault</a>
          </div>
        `;
        return;
      }
      renderProductStage(ITEM.karat);
    } catch(err) {
      document.getElementById('mainStage').innerHTML = `<div class="text-center text-muted py-5">Error establishing communication with vault.</div>`;
    }
  }

  function calculatePrice(selectedKarat) {
    let metalCost = 0;
    const isSilver = ITEM.mainCategory.includes('Silver');
    
    if (isSilver) {
      const factor = selectedKarat === '925' ? 0.9250 : 1.0000;
      metalCost = ITEM.netMetalWt * (STORE_DATA.rates.silver * factor);
    } else {
      const factors = { "24K": 1.0, "22K": 0.9166, "18K": 0.7500, "14K": 0.5833, "9K": 0.3750 };
      const factor = factors[selectedKarat] || 0.9166;
      metalCost = ITEM.netMetalWt * (STORE_DATA.rates.gold24k * factor);
    }

    const subtotal = metalCost + ITEM.makingCharges + ITEM.stoneCost;
    const gst = subtotal * (STORE_DATA.rates.gst / 100);
    return {
      metalCost: Math.round(metalCost),
      makingCharges: ITEM.makingCharges,
      stoneCost: ITEM.stoneCost,
      subtotal: Math.round(subtotal),
      gst: Math.round(gst),
      finalPrice: Math.round(subtotal + gst)
    };
  }

  function renderProductStage(selectedKarat) {
    const calc = calculatePrice(selectedKarat);
    const isSilver = ITEM.mainCategory.includes('Silver');
    const waMsg = encodeURIComponent(`Inquiry for bespoke acquisition: "${ITEM.title}" (${selectedKarat} Purity) at dynamic benchmark valuation of ₹${calc.finalPrice.toLocaleString('en-IN')}.`);
    const waLink = `https://wa.me/${WHATSAPP_PHONE}?text=${waMsg}`;

    let stoneRows = '';
    if (ITEM.stones && ITEM.stones.length > 0) {
      stoneRows = ITEM.stones.map(s => `
        <li class="list-group-item bg-transparent d-flex justify-content-between px-0 py-2 border-0">
          <span class="text-muted small">${s.type} (${s.carat ? s.carat + ' ct' : s.qty + ' pcs'})</span>
          <strong class="small">₹${Number(s.price).toLocaleString('en-IN')}</strong>
        </li>
      `).join('');
    }

    const karatOptions = isSilver ? ['925', '999'] : ['9K', '14K', '18K', '22K', '24K'];

    document.getElementById('mainStage').innerHTML = `
      <div class="mb-4" data-aos="fade-down">
        <a href="index.html" class="text-muted text-decoration-none small text-uppercase" style="letter-spacing: 0.1em;">
          ← Return to Vault
        </a>
      </div>

      <div class="row g-5">
        <div class="col-lg-6" data-aos="fade-right">
          <img src="${ITEM.image}" class="product-img-stage" alt="${ITEM.title}" onerror="this.src='https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=600'">
        </div>
        
        <div class="col-lg-6" data-aos="fade-left">
          <div class="detail-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="text-uppercase small fw-bold" style="color: var(--maroon-accent); letter-spacing: 0.1em;">${ITEM.certificate}</span>
              <span class="text-muted small">${ITEM.mainCategory}</span>
            </div>
            
            <h2 class="brand-font mb-3">${ITEM.title}</h2>
            <p class="text-muted small mb-4" style="line-height: 1.7;">${ITEM.description || 'Mastercrafted precious piece finished with authentic purity hallmarks.'}</p>

            <label class="form-label small text-muted text-uppercase fw-bold mb-2" style="letter-spacing: 0.1em;">Select Purity Grade</label>
            <div class="d-flex gap-2 mb-4 flex-wrap">
              ${karatOptions.map(k => `
                <div>
                  <input type="radio" class="btn-check" name="kOptions" id="k_${k}" ${k === selectedKarat ? 'checked' : ''} onchange="renderProductStage('${k}')">
                  <label class="btn btn-karat" for="k_${k}">${k}</label>
                </div>
              `).join('')}
            </div>

            <!-- Price Breakdown -->
            <div class="breakdown-box mb-4">
              <h6 class="brand-font mb-3" style="color: var(--maroon-accent);">Valuation Transparency Breakdown</h6>
              <ul class="list-group list-group-flush bg-transparent">
                <li class="list-group-item bg-transparent d-flex justify-content-between px-0 py-2 border-0">
                  <span class="text-muted small">${isSilver ? 'Silver' : 'Gold'} Metal (${ITEM.netMetalWt}g @ ${selectedKarat})</span>
                  <strong class="small">₹${calc.metalCost.toLocaleString('en-IN')}</strong>
                </li>
                ${stoneRows}
                <li class="list-group-item bg-transparent d-flex justify-content-between px-0 py-2 border-0">
                  <span class="text-muted small">Crafting & Wastage</span>
                  <strong class="small">₹${calc.makingCharges.toLocaleString('en-IN')}</strong>
                </li>
                <li class="list-group-item bg-transparent d-flex justify-content-between px-0 py-2 border-0">
                  <span class="text-muted small">Statutory GST (${STORE_DATA.rates.gst}%)</span>
                  <strong class="small">₹${calc.gst.toLocaleString('en-IN')}</strong>
                </li>
                <li class="list-group-item bg-transparent d-flex justify-content-between px-0 pt-3 mt-2 border-top">
                  <span class="brand-font fs-6">Net Calculated Price</span>
                  <span class="brand-font fs-4" style="color: var(--maroon-accent);">₹${calc.finalPrice.toLocaleString('en-IN')}</span>
                </li>
              </ul>
            </div>

            <a href="${waLink}" target="_blank" class="btn btn-order-wa w-100 d-block text-center text-decoration-none">
              Inquire via WhatsApp Concierge
            </a>
          </div>
        </div>
      </div>
    `;
  }

  window.onload = loadProduct;
</script>
</body>
</html>
